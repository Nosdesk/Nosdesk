[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
# Native HTTP client: the webview can't reach the API cross-origin from the
# tauri:// origin, so REST goes through this (see mobile/src/tauriHttpAdapter.ts).
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"
# Haptic feedback (iOS/Android only): the pull-to-refresh arm tick
# (see frontend/src/platform/haptics.ts). No-ops on desktop.
tauri-plugin-haptics = "2"
# System-browser OAuth (ASWebAuthenticationSession / Custom Tabs) for the native
# OIDC login against the central IdP (see mobile/src/oidc.ts).
tauri-plugin-web-auth = "1"
# iOS Universal Links / Android App Links: routes a scanned ticket QR
# (https://<slug>.nosdesk.app/tickets/<id>) into the app. The associated-domains
# entitlement (gen/apple) + App Links intent-filter (gen/android) + the backend
# /.well-known files are the OS-level source of truth; mobile/src does the
# per-tenant routing in onOpenUrl.
tauri-plugin-deep-link = "2"
# Open a URL in the system browser: the cross-tenant / not-connected fallback
# for a ticket deep link the app can't open in place (see mobile/src/deepLink.ts).
tauri-plugin-opener = "2"
# Keystore/Keychain-backed secure storage for the refresh token, native iOS +
# Android plugin code (see ../tauri-plugin-secure-store).
tauri-plugin-secure-store = { path = "../tauri-plugin-secure-store" }
# APNs/FCM push device-token registration, native iOS (swizzled app delegate) +
# Android (stub until FCM) plugin code (see ../tauri-plugin-push).
tauri-plugin-push = { path = "../tauri-plugin-push" }
# Android system bar icon appearance, so the status/navigation bars stay legible
# against the in-app theme (see ../tauri-plugin-system-bars). No-op elsewhere.
tauri-plugin-system-bars = { path = "../tauri-plugin-system-bars" }
# Native share sheet (Save to Files, AirDrop, Mail, Print on iOS; the app
# chooser on Android) for a file the webview can't save or print itself (see
# ../tauri-plugin-share and src/share_file.rs).
tauri-plugin-share = { path = "../tauri-plugin-share" }
# Decodes the percent-encoded file name header on write_share_file.
percent-encoding = "2"
# Rust HTTP client for the authenticated asset proxy (see src/asset_proxy.rs).
# rustls-tls matches tauri-plugin-http, already proven on iOS + Android.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# iOS-only: enable WKWebView's native back/forward swipe gesture (see lib.rs).
[target."cfg(target_os = \"ios\")".dependencies]
objc2 = "0.6"
