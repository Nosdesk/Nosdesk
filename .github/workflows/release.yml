name: Release

# Build + publish the production image on a version tag (e.g. v0.1.0-rc.5).
# Runs on a native amd64 runner (no QEMU), pushing to GHCR and Docker Hub.
# Does NOT re-run tests: tag a commit that already passed CI on main.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub account/org with push access to nosdesk/nosdesk
#   DOCKERHUB_TOKEN     - Docker Hub access token (write)
#   NOSDESK_ROOT_PUBKEY - plugin root public key baked into the image
# GHCR needs no secret: the built-in GITHUB_TOKEN authenticates via the
# `packages: write` permission below. First push to a pre-existing org
# package can 403 until the package is linked to this repo with write access
# (package settings -> Manage Actions access -> add repo).

on:
  push:
    tags:
      - 'v*'
  # Manual re-run against an already-pushed tag if a publish needs retrying.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Short commit SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Derives image tags from the git tag: v0.1.0-rc.5 -> 0.1.0-rc.5.
      # `latest` is applied only to stable tags (no -rc/-beta prerelease).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/nosdesk/nosdesk
            docker.io/nosdesk/nosdesk
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          # amd64 matches the current deploy target. To also publish arm64,
          # add linux/arm64 here (slower: arm64 builds under QEMU on this runner).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NOSDESK_ROOT_PUBKEY=${{ secrets.NOSDESK_ROOT_PUBKEY }}
            VITE_BUILD_SHA=${{ steps.vars.outputs.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
