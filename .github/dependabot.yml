version: 2

# The github-actions ecosystem is the one that matters most here. Every action
# in .github/workflows is pinned to a full commit SHA (mutable tags are the
# tj-actions/changed-files shape), and a SHA pin does not update itself.
# Dependabot rewrites the SHA and keeps the trailing `# vN` comment in step, so
# pinning does not decay into running a year-old action.
#
# Every ecosystem sets a 7-day `cooldown`: a compromised package release is
# usually caught within days, so a soak period avoids being the first consumer
# of a bad version. Dependabot applies 3 days implicitly and zizmor's
# dependabot-cooldown audit wants at least 7. It applies to VERSION updates
# only, so security patches are never delayed by it.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # see the note above
    labels: [dependencies, ci]
    groups:
      # One PR for the routine bumps; anything with a security advisory still
      # comes through on its own so it is not buried in a group.
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # see the note above
    labels: [dependencies, backend]
    # The tree is large and mostly transitive. Security updates always come
    # through; routine minor/patch churn is grouped to keep the PR count sane.
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # see the note above
    labels: [dependencies, frontend]
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the Go-native compiler rewrite, and vue-tsc cannot
      # drive it. vue-tsc type-checks a .vue file by splitting it into a
      # script block, a template, and a synthesized render function in
      # memory, then feeding those virtual files to the compiler through its
      # programmatic API. That API is not stabilized for the native compiler
      # until TypeScript 7.1, so vue-tsc crashes (ERR_INTERNAL_ASSERTION)
      # rather than reporting type errors. Same blocker for svelte-check,
      # astro check, and typescript-eslint.
      #
      # Nothing to fix on our side, and a weekly re-raise of an unmergeable
      # PR is pure noise. Minor and patch updates still come through.
      #
      # Revisit when vue-tsc ships native-compiler support (expected within a
      # release or two of TS 7.1, itself expected around October 2026); drop
      # this block and let the major through.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
