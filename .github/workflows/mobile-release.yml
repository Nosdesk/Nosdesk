name: Mobile release

# Manual only for now. Once a credentialed run is green, a `push: { tags: ['v*'] }`
# trigger can be added, but note that couples every version tag to a store
# build, so opt into it deliberately rather than by default.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app(s) to build and upload
        type: choice
        options: [both, ios, android]
        default: both

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight upload; queue instead.
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_IDENTIFIER: com.nosdesk.app
  # Monotonic build identifiers so re-uploads of the same marketing version do
  # not collide on TestFlight / Play.
  BUILD_NUMBER: ${{ github.run_number }}
  NOSDESK_VERSION_CODE: ${{ github.run_number }}

jobs:
  ios:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.95.0"
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: mobile/src-tauri -> target

      - name: Install JS deps + build workspace prerequisites
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nosdesk/plugin-runtime run build
          pnpm --filter @nosdesk/core run build:slots

      - name: Set up Ruby + fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile

      - name: Install XcodeGen (Tauri generates the Xcode project with it)
        run: brew install xcodegen

      - name: Write ASC API key + iOS team config
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_KEY_CONTENT" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "APPLE_API_KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          # Tauri requires the signing team in config (env alone doesn't reach
          # the export step). Injected here so it stays out of the repo; Tauri
          # auto-merges tauri.ios.conf.json.
          printf '{"bundle":{"iOS":{"developmentTeam":"%s"}}}\n' "$APPLE_TEAM_ID" \
            > mobile/src-tauri/tauri.ios.conf.json

      - name: Build + upload to TestFlight
        working-directory: mobile
        env:
          # Distribution cert + matching App Store profile; with the profile
          # installed Tauri signs the export manually (no cloud signing).
          IOS_CERTIFICATE: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROFILE_BASE64 }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          # Automatic provisioning via the API key (mints/updates the profile,
          # incl. Push). APPLE_API_KEY_PATH is set by the previous step.
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.ASC_KEY_ID }}
          # ASC key for the TestFlight upload (fastlane).
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane ios beta

  android:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: mobile/src-tauri -> target

      - name: Select JDK 17 and the preinstalled NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          # Use the runner's preinstalled stable NDK (targetSdk 36 needs r27+,
          # which it ships). Installing the local 30.x preview needs a canary
          # channel + license and fails to provision cleanly here.
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "using NDK at $ANDROID_NDK_LATEST_HOME"

      - name: Install JS deps + build workspace prerequisites
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nosdesk/plugin-runtime run build
          pnpm --filter @nosdesk/core run build:slots

      - name: Write signing + Firebase material from secrets
        working-directory: mobile/src-tauri/gen/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystore.properties
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Write Play service-account key
        env:
          PLAY_JSON_KEY_BASE64: ${{ secrets.PLAY_JSON_KEY_BASE64 }}
        run: |
          echo "$PLAY_JSON_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/play-key.json"
          echo "PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play-key.json" >> "$GITHUB_ENV"

      - name: Set up Ruby + fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile

      - name: Build + upload to Play internal
        working-directory: mobile
        run: bundle exec fastlane android beta
