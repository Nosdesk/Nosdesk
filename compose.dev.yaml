services:
  # Postgres and Redis are reachable only on the internal Compose network.
  # Use `docker compose exec postgres psql ...` / `... redis-cli ...` for shell access.

  # Backend - Development override
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    stdin_open: true
    tty: true
    env_file: docker.env
    ports: !override
      # Defaults to localhost-only; set BACKEND_BIND=0.0.0.0 to expose on LAN
      # for collaboration testing from other devices.
      - "${BACKEND_BIND:-127.0.0.1}:8080:8080"
    volumes:
      # Source code with :delegated for better macOS performance
      - ./backend/src:/app/src:delegated
      - ./backend/tests:/app/tests:delegated
      - ./backend/migrations:/app/migrations:delegated
      - ./backend/Cargo.toml:/app/Cargo.toml:delegated
      - ./backend/Cargo.lock:/app/Cargo.lock:delegated
      # Build output - :cached ensures container sees host changes quickly
      - ./backend/public:/app/public:cached
      # Named volumes for caching
      - backend_cargo_cache:/usr/local/cargo/registry
      - backend_target_cache:/app/target # Cache compiled artifacts
      - backend_uploads:/app/uploads
      # Seed data files
      - ./backend/seeds:/app/seeds:ro
      # Plugins provisioning directory
      - ./examples/plugins:/app/plugins:ro
    environment:
      - RUST_LOG=debug,actix_web=debug,actix_server=info,diesel=debug
      - RUST_BACKTRACE=1
      - CARGO_MESSAGE_FORMAT=short
      - CARGO_TERM_COLOR=always
    healthcheck:
      start_period: 120s # Longer for dev due to compilation time

  # Greenmail — in-memory IMAP/SMTP server used only by the channel
  # integration test (`tests/channels_email_imap_integration.rs`).
  # Started on demand via the `email-testing` profile:
  #   docker compose -f compose.yaml -f compose.dev.yaml --profile email-testing up -d greenmail
  # Not started with the regular dev environment — nothing blocks the
  # usual workflow when you don't need it.
  greenmail:
    profiles: ["email-testing"]
    image: greenmail/standalone:2.1.3
    networks:
      - nosdesk-network
    ports:
      - "127.0.0.1:3025:3025"  # SMTP
      - "127.0.0.1:3143:3143"  # IMAP
      - "127.0.0.1:3465:3465"  # SMTPS
      - "127.0.0.1:3993:3993"  # IMAPS
    environment:
      # Single test user: support@example.com / hunter2
      # -Dgreenmail.verbose enables wire-level logging which we grep in tests.
      # `-Dgreenmail.hostname=0.0.0.0` is required so the services bind
      # on the container's external interface, not just loopback.
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=support:hunter2@example.com -Dgreenmail.verbose

  # Frontend Build Service - Development (for live reloading)
  frontend-watch:
    image: node:20-alpine
    working_dir: /app
    networks:
      - nosdesk-network
    volumes:
      - ./frontend:/app
      - ./backend/public:/app/dist # Mount the backend public directory to dist
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Required for file watching in Docker on macOS/Windows
    command: sh -c "npm install && npm run dev:unified"

volumes:
  frontend_node_modules:
    driver: local
  backend_cargo_cache:
    driver: local
  backend_target_cache:
    driver: local
  backend_uploads:
    driver: local
