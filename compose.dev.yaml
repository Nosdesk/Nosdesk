services:
  # Postgres — dev override exposes the port on the host loopback so
  # `cargo test` can reach the `helpdesk_test` database from outside
  # the compose network without a socat bridge dance. Bound to
  # 127.0.0.1 (no LAN exposure) and on a deliberately non-standard
  # port so it doesn't fight a developer's host Postgres on 5432.
  # The container internal port stays 5432 for sibling services.
  postgres:
    ports:
      - "127.0.0.1:54329:5432"

  # Redis — dev override publishes the port on host loopback so
  # `cargo test` can reach it for redis-backed integration tests (the
  # collab ownership-claim suite), mirroring the postgres override
  # above. Bound to 127.0.0.1, non-standard host port; the container
  # port stays 6379 for sibling services. Tests use the dev-default
  # REDIS_PASSWORD and an isolated db index (see TEST_REDIS_URL in
  # backend/.cargo/config.toml).
  redis:
    ports:
      - "127.0.0.1:63799:6379"

  # Backend - Development override.
  #
  # Source files reach the container via `docker compose watch`,
  # not bind mounts. The watch sync action *copies* changed files
  # from the host into the container's local filesystem, which:
  #
  #   1. avoids the macOS osxfs/grpcfuse volume-mount perf
  #      penalty on Rust rebuilds, and
  #   2. lets bacon's inotify-based watcher fire normally on
  #      file events (bind mounts on macOS don't reliably
  #      propagate inotify; see Canop/bacon#313).
  #
  # The named volumes for cargo / target / uploads stay because
  # they're container-internal and shouldn't be synced to the host.
  # The frontend-watch service still uses a regular bind mount for
  # ./backend/public because that directory is bidirectional
  # (frontend writes, backend reads) and therefore can't use the
  # one-way watch sync model.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    # Empty default = host arch. Override with BACKEND_PLATFORM=linux/amd64
    # (or linux/arm64) to test the other architecture.
    platform: ${BACKEND_PLATFORM:-}
    stdin_open: true
    tty: true
    env_file: docker.env
    # 8 GB memory ceiling. The Rust debug-link step on a workspace
    # this size peaks past 6 GB once the multi-tenant work landed;
    # bumping the cap unblocks bacon-driven rebuilds. Docker Desktop
    # users may need to raise the host VM memory under Settings ->
    # Resources to actually get the full 8 GB.
    mem_limit: 8g
    ports: !override
      # Defaults to localhost-only; set BACKEND_BIND=0.0.0.0 to expose on LAN
      # for collaboration testing from other devices.
      - "${BACKEND_BIND:-127.0.0.1}:8080:8080"
    develop:
      watch:
        # Source — host edits land in the container's local FS,
        # bacon picks them up with normal inotify and rebuilds.
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: sync
          path: ./backend/tests
          target: /app/tests
        - action: sync
          path: ./backend/migrations
          target: /app/migrations
        # Shared Fluent message catalogues live at workspace root
        # (so the frontend can import the same files later). The
        # backend `include_str!`s them via ../../../i18n/locales/...
        # from src/utils/i18n.rs, which resolves to /i18n inside
        # the container.
        - action: sync+restart
          path: ./i18n
          target: /i18n
        # Manifest changes need cargo to re-resolve dependencies.
        # `sync+restart` syncs the file then restarts bacon, which
        # re-runs `cargo run` and picks up the new deps. Cheaper
        # than `rebuild` (full image rebuild) — the cargo cache
        # named volume is preserved across restarts.
        - action: sync+restart
          path: ./backend/Cargo.toml
          target: /app/Cargo.toml
        - action: sync+restart
          path: ./backend/Cargo.lock
          target: /app/Cargo.lock
        - action: sync
          path: ./backend/diesel.toml
          target: /app/diesel.toml
    volumes:
      # Build output — :cached because the frontend-watch service
      # writes here and the backend reads it. Bidirectional, so
      # this stays a bind mount rather than moving to watch sync.
      - ./backend/public:/app/public:cached
      # Named volumes for caching — container-internal.
      - backend_cargo_cache:/usr/local/cargo/registry
      - backend_target_cache:/app/target # Cache compiled artifacts
      - backend_uploads:/app/uploads
      # Seed data — read-only and rarely changes; bind mount is fine.
      - ./backend/seeds:/app/seeds:ro
      # Signed plugin zips (*.zip) picked up at startup. In dev, set
      # NOSDESK_DEV_MODE=1 in docker.env to also accept unsigned
      # zips produced by `nosdesk-plugin sign --dev`.
      - ./plugins:/app/plugins:ro
    environment:
      # Per-crate caps for chatty third-party crates: tantivy logs every
      # segment open and commit at INFO+DEBUG (saw ~90% of stdout); the
      # connection plumbing crates (h2, hyper, rustls, mio, want) emit
      # similar lifecycle chatter at debug. Operators bump any of these
      # by editing this var. Mirrored in docker.env and .env.
      - RUST_LOG=debug,actix_web=debug,actix_server=info,diesel=debug,tantivy=warn,h2=info,hyper=info,hyper_util=info,rustls=info,mio=info,want=info
      - RUST_BACKTRACE=1
      - CARGO_MESSAGE_FORMAT=short
      - CARGO_TERM_COLOR=always
      # Tests run against a dedicated database so test fixtures don't
      # burn sequence values out of the dev DB. See `init-db.sql` for
      # the CREATE DATABASE + GRANT, and `backend/src/test_helpers.rs`
      # for the hard-fail when this is unset.
      - TEST_DATABASE_URL=postgres://${POSTGRES_USER:-nosdesk}:${POSTGRES_PASSWORD:-nosdesk_password}@postgres:5432/helpdesk_test
      # NOSDESK_ROOT_PUBKEY is loaded from docker.env via env_file. Do
      # not redeclare it here, since environment: would override the
      # docker.env value with whatever the host shell has (typically
      # empty) and break option_env! at compile time inside bacon.
      # Default the dev backend to the production registry so the
      # admin /plugins/registry view shows real data without
      # extra config. Override to a fork's registry by setting
      # the env var; pass an empty string to disable sync.
      - NOSDESK_REGISTRY_URL=${NOSDESK_REGISTRY_URL:-https://nosdesk.com/registry}
      # Route outbound mail through the Mailpit sidecar (web UI on
      # http://localhost:8025) instead of a real SMTP relay. These
      # vars OVERRIDE whatever's in docker.env so dev never burns
      # real customer email on a stray test invitation. Plaintext
      # SMTP is fine: the link only exists inside the compose
      # network. Username / password are placeholders — Mailpit
      # accepts any credentials but EmailConfig::is_configured()
      # requires them to be non-empty.
      - SMTP_ENABLED=true
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_SECURITY=plaintext
      - SMTP_USERNAME=mailpit
      - SMTP_PASSWORD=mailpit
      - SMTP_FROM_NAME=Nosdesk
      - SMTP_FROM_EMAIL=noreply@nosdesk.test
    healthcheck:
      start_period: 120s # Longer for dev due to compilation time

  # Mailpit — local SMTP capture for development. Replaces real
  # SMTP relay in dev so password resets, invitations, and ticket
  # notifications land in a browser UI instead of customer
  # mailboxes. Plain SMTP on 1025, web UI on 8025. Anonymous auth
  # accepted; we still pass placeholder username/password so the
  # backend's `is_configured()` gate doesn't trip.
  #
  # Backend env override below points SMTP_HOST/PORT/SECURITY at
  # this service. Operators running the production compose (without
  # `-f compose.dev.yaml`) keep their real SMTP credentials from
  # `docker.env` and never see this service.
  mailpit:
    image: axllent/mailpit:v1.20
    networks:
      - nosdesk-network
    ports:
      - "127.0.0.1:8025:8025"  # Web UI
      # SMTP port (1025) intentionally not published — only reachable
      # by sibling services on the compose network, so a dev box
      # can't be accidentally turned into an open relay if a stray
      # process binds it.

  # Greenmail — in-memory IMAP/SMTP server used only by the channel
  # integration test (`tests/channels_email_imap_integration.rs`).
  # Started on demand via the `email-testing` profile:
  #   docker compose -f compose.yaml -f compose.dev.yaml --profile email-testing up -d greenmail
  # Not started with the regular dev environment — nothing blocks the
  # usual workflow when you don't need it.
  greenmail:
    profiles: ["email-testing"]
    image: greenmail/standalone:2.1.3
    networks:
      - nosdesk-network
    ports:
      - "127.0.0.1:3025:3025"  # SMTP
      - "127.0.0.1:3143:3143"  # IMAP
      - "127.0.0.1:3465:3465"  # SMTPS
      - "127.0.0.1:3993:3993"  # IMAPS
      - "127.0.0.1:8080:8080"  # API (per-test mailbox purge + readiness)
    environment:
      # Single test user: support@example.com / hunter2
      # -Dgreenmail.verbose enables wire-level logging which we grep in tests.
      # `-Dgreenmail.hostname=0.0.0.0` is required so the services bind
      # on the container's external interface, not just loopback.
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=support:hunter2@example.com -Dgreenmail.verbose

  # Frontend Build Service - Development (for live reloading)
  frontend-watch:
    image: node:24-alpine
    working_dir: /app
    networks:
      - nosdesk-network
    volumes:
      - ./frontend:/app
      - ./backend/public:/app/dist # Mount the backend public directory to dist
      - frontend_node_modules:/app/node_modules
      # Shared Fluent catalogues — same files the backend
      # include_str!s. Mounted read-only so Vite can resolve
      # `import.meta.glob('../../../i18n/locales/*/main.ftl')`
      # from frontend/src/i18n/index.ts (three `..` from there
      # reach `/`, where this mount lives).
      - ./i18n:/i18n:ro
    command: sh -c "npm install && npm run dev:unified"

volumes:
  frontend_node_modules:
    driver: local
  backend_cargo_cache:
    driver: local
  backend_target_cache:
    driver: local
  backend_uploads:
    driver: local
