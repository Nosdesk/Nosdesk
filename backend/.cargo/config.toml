# Backend-local cargo config.
#
# Sets `TEST_DATABASE_URL` so `cargo test` can reach the dedicated
# `nosdesk_test` database without each developer having to remember
# to export the variable. The host port (54329) is published by
# `compose.dev.yaml`'s postgres override; bring the dev stack up
# with `docker compose -f compose.yaml -f compose.dev.yaml up -d`
# and tests work without further setup.
#
# Why a dedicated test DB rather than DATABASE_URL? Postgres sequences
# are non-transactional, so every fixture insert would burn an id out
# of the dev database's sequences and push ticket numbers into the
# thousands after a few `cargo test` runs. See
# `src/test_helpers.rs::test_database_url` for the hard-fail when the
# dev compose stack isn't running.
#
# This file is intentionally committed: it's part of the project's
# "clone, docker compose up, cargo test" contract. Override locally
# by exporting `TEST_DATABASE_URL` in your shell — env vars set in
# the parent shell take precedence over `[env]` here.

[env]
TEST_DATABASE_URL = "postgres://nosdesk:nosdesk_password@127.0.0.1:54329/nosdesk_test"
# Redis for redis-backed integration tests (the collab ownership-claim
# suite). Published on host loopback by compose.dev.yaml's redis
# override; db index 15 isolates test keys from the dev backend's cache
# on db 0. Uses the dev-default REDIS_PASSWORD.
TEST_REDIS_URL = "redis://:nosdesk_redis_password@127.0.0.1:63799/15"
