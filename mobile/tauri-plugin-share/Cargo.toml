[package]
name = "tauri-plugin-share"
version = "0.1.0"
authors = ["Nosdesk"]
description = "Native share sheet for a file the mobile app has written to its cache"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-share"

[dependencies]
tauri = "2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
