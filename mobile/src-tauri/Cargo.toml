[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
# Native HTTP client: the webview can't reach the API cross-origin from the
# tauri:// origin, so REST goes through this (see mobile/src/tauriHttpAdapter.ts).
tauri-plugin-http = "2"
tauri-plugin-log = "2"

# OS keychain for the refresh token (see src/keychain.rs). The iOS Keychain
# (and macOS for `tauri dev`) via SecItem, with explicit accessibility control.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
security-framework = "3"
security-framework-sys = "2"
