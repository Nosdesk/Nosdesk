[package]
name = "tauri-plugin-push"
version = "0.1.0"
authors = ["Nosdesk"]
description = "APNs/FCM push-notification device-token registration for the mobile app"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-push"

[dependencies]
tauri = "2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
