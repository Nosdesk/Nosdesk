name: nosdesk

services:
  nosdesk:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # Pinned rather than relying on "last stage wins": the Dockerfile also
      # carries an `e2e` stage (runtime plus the demo seeder) that this stack
      # must never pick up. compose.e2e.yaml overrides it.
      target: runtime
      args:
        NOSDESK_ROOT_PUBKEY: ${NOSDESK_ROOT_PUBKEY:-}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    volumes:
      - backend_uploads:/app/uploads
      - ./plugins:/app/plugins:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - nosdesk-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    networks:
      - nosdesk-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nosdesk} -d ${POSTGRES_DB:-nosdesk}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    env_file: .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-nosdesk_redis_password}
    volumes:
      - redis_data:/data
    networks:
      - nosdesk-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  nosdesk-network:
    driver: bridge
