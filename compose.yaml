name: nosdesk

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: docker.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - nosdesk-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nosdesk} -d ${POSTGRES_DB:-nosdesk}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    env_file: docker.env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-nosdesk_redis_password}
    volumes:
      - redis_data:/data
    networks:
      - nosdesk-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend - Production
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Passed through to the Rust build so option_env!() picks up
        # the real Nosdesk root pubkey. Operators can override by
        # setting NOSDESK_ROOT_PUBKEY in docker.env (or their shell)
        # before running `docker compose build`. Unset = empty =
        # official/verified installs fail closed until configured.
        NOSDESK_ROOT_PUBKEY: ${NOSDESK_ROOT_PUBKEY:-}
    platform: linux/amd64
    restart: unless-stopped
    env_file: docker.env
    volumes:
      - backend_uploads:/app/uploads
      # Drop signed plugin zips (*.zip) into ./plugins/ to provision
      # them on startup. The file's presence IS the declaration; the
      # backend verifies each zip's signature against the trust chain
      # (baked-in root, registered publishers, or local signing key)
      # and refuses anything unsigned.
      - ./plugins:/app/plugins:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - nosdesk-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  nosdesk-network:
    driver: bridge
