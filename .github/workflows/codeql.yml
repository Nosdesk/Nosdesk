name: CodeQL

# First-party static analysis into the Security tab. Free on this repo (public).
#
# Rust is analysed with `build-mode: none`: CodeQL's Rust support went GA in
# October 2025 and no longer needs to observe a real cargo build, so this does
# not duplicate ci.yml's compile. That also keeps the job off the critical path
# for merges, which is why findings land in the Security tab rather than as a
# blocking check.
#
# `actions` is a language here, not a mistake: CodeQL scans workflow files for
# injection and permission problems. It overlaps zizmor.yml deliberately (the
# two disagree often enough to be worth both).
#
# A pull request analyses only the languages it changes; the Rust analysis
# alone takes well over an hour, and a docs-only change gets none. Pushes to
# main and the weekly run analyse every language, so main always has a full
# baseline. A change to this file or .github/codeql/ analyses every language
# too.
#
# Rust is two analyses. The backend's leaves out test code: the extractor turns
# cfg(test) on unless told otherwise, which analyses test-only fallbacks in
# place of the code that ships, and test files make up about a quarter of the
# backend. mobile/ has its own, so the backend's doesn't load the Tauri
# dependency tree.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new query release finds old code without waiting for a push
    # to the relevant file.
    - cron: '0 3 * * 1'

# A new push supersedes a pull request's running analysis. Runs on main finish,
# with queued pushes collapsing to the latest, so main keeps a full baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  languages:
    name: Pick languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # The pull request checkout is its merge commit, so its first parent is
      # the base it merges onto and the diff between them is the PR's change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          else
            changed=ALL
          fi
          # touches INCLUDE [EXCLUDE]: a changed path matches INCLUDE and not
          # EXCLUDE. Pushes, the schedule and CodeQL config changes match all.
          touches() {
            [ "$changed" = ALL ] && return 0
            grep -qE '^\.github/(workflows/codeql\.yml|codeql/)' <<<"$changed" && return 0
            local hits
            hits=$(grep -E "$1" <<<"$changed" || true)
            if [ -n "${2:-}" ]; then
              hits=$(grep -vE "$2" <<<"$hits" || true)
            fi
            [ -n "$hits" ]
          }
          rust='\.rs$|(^|/)Cargo\.(toml|lock)$'
          rust_tests='^backend/tests/|/tests\.rs$|^backend/src/(test_helpers|route_registration_tests)\.rs$'
          langs=()
          if touches "$rust" "^mobile/|$rust_tests"; then
            langs+=('{"name":"rust","language":"rust","build-mode":"none","config-file":"./.github/codeql/rust-backend.yml","category":"/language:rust"}')
          fi
          if touches "^mobile/.*($rust)"; then
            langs+=('{"name":"rust-mobile","language":"rust","build-mode":"none","config-file":"./.github/codeql/rust-mobile.yml","category":"/language:rust-mobile"}')
          fi
          if touches '\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue|html)$'; then
            langs+=('{"name":"javascript-typescript","language":"javascript-typescript","build-mode":"none","category":"/language:javascript-typescript"}')
          fi
          if touches '^\.github/(workflows|actions)/'; then
            langs+=('{"name":"actions","language":"actions","build-mode":"none","category":"/language:actions"}')
          fi
          matrix="[$(IFS=,; echo "${langs[*]}")]"
          echo "Analysing: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.name }})
    needs: languages
    if: needs.languages.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      # Upload results to code scanning.
      security-events: write
      contents: read
    env:
      # Analyse the build that ships: without this the Rust extractor turns
      # cfg(test) on, pulling in #[cfg(test)] modules and dropping
      # #[cfg(not(test))] code. Only the Rust extractor reads it.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: '-test'
    strategy:
      # One language failing should still publish the others' results.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Set for the two Rust analyses; empty (unset) for the others.
          config-file: ${{ matrix.config-file }}
          # security-extended over the default suite: this is a helpdesk holding
          # customer data, and the extra false positives are triaged once in the
          # Security tab rather than blocking a merge.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: ${{ matrix.category }}
