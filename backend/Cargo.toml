[package]
name = "backend"
version = "0.1.0"
edition = "2021"
default-run = "backend"
license = "BUSL-1.1"
publish = false

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "import_tickets"
path = "src/bin/import_tickets.rs"

[[bin]]
name = "nosdesk-cli"
path = "src/bin/nosdesk_cli.rs"

[dependencies]
actix-web = "4.9.0"
diesel = { version = "2.2.0", features = ["postgres", "r2d2", "chrono", "serde_json", "uuid", "network-address", "numeric"] }
diesel_migrations = "2.2.0"
bigdecimal = { version = "0.4", features = ["serde"] }
# dotenvy is a maintained drop-in for the unmaintained dotenv crate.
# API surface is identical (same `dotenv()` entry point under the
# `dotenvy::dotenv` path), so callers only change their import line.
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"  # SLA business-hours arithmetic walks named timezones
rrule = "0.13"     # RFC 5545 RRULE parsing for recurring tickets
r2d2 = "0.8.10"
uuid = { version = "1.17", features = ["v4", "v7", "serde"] }
actix-cors = "0.7.0"
actix-multipart = "0.6.1"
csv = "1.3"        # RFC 4180 CSV parser for the admin bulk-import flow
actix-files = "0.6.5"
futures = "0.3"
jsonwebtoken = "9.3.0"
bcrypt = "0.15.1"  # Legacy hashing - kept for existing recovery codes hashed before the argon2 migration; password hashing also still uses it
argon2 = "0.5"     # MFA recovery code hashing (and future password migration target); OWASP-recommended memory-hard KDF
actix-web-httpauth = "0.8.2"
regex = "1.11.0"
clap = { version = "4.5", features = ["derive"] }  # nosdesk-cli
rpassword = "7"                                    # nosdesk-cli interactive password prompt (no-echo)
quick-xml = "0.36"  # SVG validator for plugin icons
semver = "1.0"      # engines.nosdesk constraint matching
maxminddb = "0.28"  # offline IP geolocation for session display (operator-supplied .mmdb via GEOIP_DB_PATH)

# WebSocket dependency for collaborative editing. The deprecated
# actix-web-actors crate (which pulled in the full `actix` actor
# framework) was replaced with the lighter actorless `actix-ws`
# during the YjsWebSocket migration; see `handlers/collaboration.rs`
# for the session_task implementation.
actix-ws = "0.4"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }  # Stream wrappers for tokio types
tokio-util = "0.7"  # CancellationToken used by the periodic scheduler + future graceful-shutdown wiring
# Async Postgres client used only by the sync-outbox listener
# (services/sync_outbox.rs) for `LISTEN sync_actions_new`. Diesel's
# libpq client is synchronous and doesn't expose notifications cleanly,
# so the listener holds its own dedicated connection outside the r2d2
# pool. HTTP handlers continue to use Diesel + r2d2 as before.
tokio-postgres = "0.7"
lazy_static = "1.5.0"        # For static mutable state
dashmap = "6.1.0"            # Thread-safe concurrent hashmap
env_logger = "0.11.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-actix-web = "0.7"
mockall = { version = "0.13.0", optional = true }
actix-service = "2.0.2"
derive_more = "0.99.17"
rand = "0.8.5"              # Random number generation for auth state
reqwest = { version = "0.13", features = ["json", "form"] } # HTTP client for OAuth requests
urlencoding = "2.1.3"       # URL encoding/decoding
url = "2.5"                 # URL parsing and manipulation
querystring = "1.1.0"       # Query string parsing

# Add yrs for Yjs/CRDT support in Rust
yrs = { version = "0.26", features = ["sync"] }
lib0 = "0.16.10"
bytes = "1.5.0"

# Add base64 for encoding/decoding binary data
base64 = "0.21.7"

# Add fastrand dependency
fastrand = "2.0.0"

# Add mime crate
mime = "0.3.17"

# Image processing for thumbnail generation (v0.25+ has native EXIF orientation support)
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png", "rayon"] }

# PDF rendering for thumbnail generation
pdfium-render = { version = "0.8", features = ["image", "thread_safe"] }

# Rate limiting for security
actix-limitation = "0.5.1"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# MFA (Multi-Factor Authentication) dependencies
totp-rs = "5.4.0"         # TOTP (Time-based One-Time Password) implementation
qrcode = "0.14.1"         # QR code generation
base32 = "0.4.0"          # Base32 encoding for TOTP secrets

# Security dependencies for MFA encryption and CSRF
ring = "0.17.8"           # Cryptographic primitives for AES-256-GCM encryption and SHA-256 hashing
zeroize = { version = "1.8.1", features = ["derive"] } # Memory zeroing for sensitive data
hex = "0.4.3"             # Hex encoding/decoding
constant_time_eq = "0.3"  # Constant-time comparison for CSRF tokens
ipnetwork = { version = "0.21.1", features = ["serde"] }  # IP network types for security events and sessions (must match diesel version)
anyhow = "1.0"             # Error handling for applications
thiserror = "2"            # Derive macros for explicit error enums
async-trait = "0.1.83"     # Async traits for storage abstraction
# S3-compatible object storage (STORAGE_TYPE=s3), targeting fly.io Tigris.
# Custom endpoint + static creds from env; the byte-oriented Storage trait
# only needs put/get/delete/head/copy.
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }

# Email dependencies
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder", "hostname"] }
# HTML / plaintext interconversion for outbound channel relays. `html2text`
# renders the rich HTML the editor produces into a readable plaintext
# fallback for the multipart/alternative email body. `html-escape` is the
# small, focused crate we use whenever we need to embed a plaintext string
# safely inside an HTML body (signature lines, quote attribution).
html2text = "0.12"
html-escape = "0.2"
# Server-side HTML sanitiser for inbound email rendering. Built on
# html5ever (the Servo HTML parser), so it's the right tool for
# untrusted HTML rather than regex-based stripping. Runs at ingest
# in `services::channels::email_sanitise`; the frontend still
# layers DOMPurify before iframe injection as defence-in-depth.
ammonia = "4"
# DNS resolver for pre-flight MX lookup on guest-submitted email addresses.
# Catches `random@nonexistentdomain.tld` before we waste an invitation email on it.
hickory-resolver = { version = "0.26", features = ["tokio"] }

# File validation - MIME type detection via magic numbers
infer = "0.16"             # Detect file types from magic numbers for secure upload validation

# OpenID Connect support
openidconnect = "4.0"      # OIDC client library with PKCE, discovery, and token validation
once_cell = "1.19"         # Lazy initialization for OIDC client cache

# WebAuthn/Passkey support
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.5"  # Protocol types for WebAuthn

# Backup and restore dependencies
zip = "0.6"                # ZIP archive creation/extraction
walkdir = "2.5"            # Directory walking for file backup
sanitize-filename = "0.5"  # Filename sanitization for uploads

# Full-text search
tantivy = "0.26"           # Fast full-text search engine (Rust equivalent of Lucene)

# Channel adapter: IMAP ingestion
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }  # Async IMAP client for pull-based email ingestion
tokio-native-tls = "0.3"   # TLS transport for async-imap over 993 (tokio io traits)
native-tls = "0.2"         # Underlying TLS connector type
mailparse = "0.16"         # RFC 5322 parser — headers, attachments, References chain

# Application metrics. No recorder is installed by default — `counter!`
# / `histogram!` calls are zero-cost until a subscriber (e.g.
# `metrics-exporter-prometheus`) is wired in. Instrumenting now means
# the call sites are already in place when the /metrics endpoint is
# added.
metrics = "0.24"

# Localization. Fluent (Mozilla's i18n format) bundles message
# catalogues per locale; we embed .ftl resources from the shared
# `i18n/locales/` tree via `include_str!` so the backend ships a
# self-contained set of translations. fluent-langneg implements
# RFC 4647 Accept-Language negotiation against our supported
# locale list. unic-langid is the BCP-47 language tag type used
# across the Fluent ecosystem.
fluent-bundle = "0.16"
unic-langid = "0.9"

# For testing only
[dev-dependencies]
actix-rt = "2.10.0"
# actix-test ships a real WS client (`srv.ws_at(path)`) so the
# collaboration integration tests don't need a separate
# tungstenite stack; the awc re-export from actix-test provides
# the Sink<ws::Message> + Stream<ws::Frame> client framing.
actix-test = "0.1"
awc = "3"
futures-util = "0.3"
mockall = "0.13.0"
tempfile = "3"
