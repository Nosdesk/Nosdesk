name: Release

# Build + publish the production image on a version tag (e.g. v0.1.0-rc.5),
# then create the matching GitHub Release. Runs on a native amd64 runner (no
# QEMU). Stable tags push to GHCR and Docker Hub; `-rc`/`-beta` prereleases
# push to GHCR only and are marked prerelease so the in-app updater
# (stable-only /releases/latest) skips them.
# Does NOT re-run tests: tag a commit that already passed CI on main.
# Does wait for CodeQL's analysis of the tag (codeql.yml runs on v* tags), and
# publishes nothing while the tag has an open high or critical alert. A release
# therefore lands about two hours after the tag.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub account/org with push access to nosdesk/nosdesk
#   DOCKERHUB_TOKEN     - Docker Hub access token (write)
#   NOSDESK_ROOT_PUBKEY - plugin root public key baked into the image
# GHCR needs no secret: the built-in GITHUB_TOKEN authenticates via the
# `packages: write` permission below. First push to a pre-existing org
# package can 403 until the package is linked to this repo with write access
# (package settings -> Manage Actions access -> add repo).

on:
  push:
    tags:
      - 'v*'
  # Manual re-run against an already-pushed tag if a publish needs retrying.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default for any job that does not scope its own token. The jobs below
# narrow or widen this explicitly; without it they would inherit the
# repository default instead.
permissions:
  contents: read

jobs:
  codeql-gate:
    name: CodeQL gate
    runs-on: ubuntu-latest
    # The tag's Rust analysis alone takes well over an hour.
    timeout-minutes: 180
    permissions:
      actions: read          # the CodeQL run for this tag
      security-events: read  # its analyses and alerts
    steps:
      - name: Wait for CodeQL to analyse the tag
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # codeql.yml starts on the same tag push. Allow a few minutes for it
          # to appear, then until the job timeout for it to finish.
          for attempt in $(seq 1 85); do
            run=$(gh run list -R "$REPO" --workflow codeql.yml --commit "$SHA" --event push \
              --json databaseId,headBranch,status,conclusion \
              --jq "[.[] | select(.headBranch == \"$TAG\")][0] // empty | \"\(.databaseId) \(.status) \(.conclusion)\"")
            case "$run" in
              *" completed success")
                echo "id=${run%% *}" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              *" completed "*)
                echo "::error::CodeQL on $TAG finished as '${run##* }'. Re-run CodeQL on the tag, then re-run this release."
                exit 1 ;;
              "")
                if [ "$attempt" -ge 5 ]; then
                  echo "::error::No CodeQL run for $TAG. Run the CodeQL workflow on the tag, then re-run this release."
                  exit 1
                fi ;;
            esac
            sleep 120
          done
          echo "::error::CodeQL on $TAG did not finish in time. Re-run this release once it has."
          exit 1

      - name: No open high or critical alerts on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          set -euo pipefail
          # One analysis per language the run analysed. Uploaded results take
          # a moment to process, so wait for all of them.
          expected=$(gh run view "$RUN_ID" -R "$REPO" --json jobs \
            --jq '[.jobs[] | select(.name | startswith("Analyze"))] | length')
          for attempt in $(seq 1 20); do
            have=$(gh api "repos/$REPO/code-scanning/analyses?tool_name=CodeQL&ref=$REF&per_page=100" \
              --jq "[.[] | select(.commit_sha == \"$SHA\") | .category] | unique | length")
            [ "$have" -ge "$expected" ] && break
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Only $have of $expected CodeQL analyses are recorded for $TAG."
              exit 1
            fi
            sleep 30
          done
          found=$(gh api --paginate "repos/$REPO/code-scanning/alerts?tool_name=CodeQL&ref=$REF&state=open&per_page=100" \
            --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical") | "\(.rule.security_severity_level): \(.rule.description) at \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line) \(.html_url)"')
          if [ -n "$found" ]; then
            echo "::error::$TAG has open high or critical CodeQL alerts. Fix or dismiss them, then re-run this release."
            echo "$found"
            exit 1
          fi
          echo "CodeQL: no open high or critical alerts on $TAG."

  image:
    name: Build & push image
    needs: codeql-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Short commit SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Derives image tags from the git tag: v1.1.0 -> 1.1.0, 1.1 and latest;
      # v1.1.0-rc.4 -> 1.1.0-rc.4 only. `1.1` (a minor's newest patch) and
      # `latest` (the newest stable release) go to stable tags only. There is
      # no major-only tag. release/1.0.x publishes 1.0.x and `1.0`, never
      # `latest`.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Prerelease tags (-rc/-beta) publish to GHCR only; Docker Hub gets
          # stable releases only. metadata-action drops the disabled image.
          images: |
            ghcr.io/nosdesk/nosdesk
            name=docker.io/nosdesk/nosdesk,enable=${{ !contains(github.ref_name, '-') }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # Stable tags only; prereleases publish to GHCR alone (no Docker Hub push).
        if: ${{ !contains(github.ref_name, '-') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          # Pinned rather than relying on "last stage wins": the Dockerfile also
          # carries an `e2e` stage (runtime plus the demo seeder) that a
          # published image must never pick up.
          target: runtime
          # amd64 matches the current deploy target. To also publish arm64,
          # add linux/arm64 here (slower: arm64 builds under QEMU on this runner).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NOSDESK_ROOT_PUBKEY=${{ secrets.NOSDESK_ROOT_PUBKEY }}
            NOSDESK_VERSION=${{ steps.meta.outputs.version }}
            VITE_BUILD_SHA=${{ steps.vars.outputs.sha }}
          provenance: false
          # Registry cache instead of GHA cache: the heavy Rust target dir
          # exceeds GitHub's 10 GB per-repo cache cap and gets evicted, so GHA
          # cache effectively cold-builds each time. A GHCR cache image has no
          # such cap. Dedicated release ref (the dev-image workflow uses its own).
          cache-from: type=registry,ref=ghcr.io/nosdesk/nosdesk:buildcache-release
          cache-to: type=registry,ref=ghcr.io/nosdesk/nosdesk:buildcache-release,mode=max

      # Publish the GitHub Release once the image is up. Prerelease tags
      # (anything with a `-`, e.g. -rc.5/-beta) are marked prerelease, so the
      # in-app updater's /releases/latest query keeps skipping them and only
      # surfaces stable releases. `make_latest` is set rather than left to
      # GitHub's default: only a stable release becomes /releases/latest.
      # Idempotent: a re-run updates the release.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Container image `${{ steps.meta.outputs.version }}`:
            - `docker pull ghcr.io/nosdesk/nosdesk:${{ steps.meta.outputs.version }}`
            - `docker pull docker.io/nosdesk/nosdesk:${{ steps.meta.outputs.version }}`
